name: Bug report
description: Report a reproducible defect using synthetic data
body:
  - type: textarea
    id: summary
    attributes: { label: Summary }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Do not include private plugins or secrets. }
    validations: { required: true }
  - type: input
    id: runtime
    attributes: { label: Node.js and OS }
    validations: { required: true }
